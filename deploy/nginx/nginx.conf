worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream gateway_cluster {
        # Docker DNS resolves service name 'gateway' to all replica IPs
        server gateway:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;  # Generous for long SSE streams
        proxy_send_timeout 120s;

        location / {
            proxy_pass http://gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        location /health {
            proxy_pass http://gateway_cluster/health;
        }

        # Restrict metrics endpoint to internal monitoring networks
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://gateway_cluster/metrics;
        }
    }
}
