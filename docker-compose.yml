services:
  # === Gateway ===
  gateway:
    build: ./gateway
    expose:
      - "8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # === PostgreSQL + pgvector ===
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routewise}
      POSTGRES_USER: ${POSTGRES_USER:-routewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routewise}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis ===
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Mock Provider (load testing) ===
  mock-provider:
    build: ./mock-provider
    ports:
      - "8001:8001"
    profiles:
      - testing
      - full

  # === Prometheus ===
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    profiles:
      - monitoring
      - full

  # === Grafana ===
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - full

  # === Nginx (multi-replica load balancing) ===
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway

  # === React Admin Dashboard ===
  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - gateway
    profiles:
      - dashboard
      - full

  # === College Assistant (RAG Client) ===
  rag-client:
    build: ./rag-client
    ports:
      - "8002:8002"
    environment:
      - GATEWAY_URL=http://gateway:8000/v1/chat/completions
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-rw_dev_key}
    depends_on:
      - gateway
    profiles:
      - rag
      - full

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
